<script type=text/javascript>
  window.resizeTo(560,540);
  let input_file;
  let output_file;
function menu_selected(no) {
        console.log(no + ".が選択されました！"); 
        myForm.sel.value = no;
        if (no=="1") {
            window.open('./MakeMosaic.html','_NEW');
        }
        if (no=="4") {
            window.open('./ALGmoz0.html','algFJ');
        }
        if (no=="5") {
            //          ===== 原HTMLデータ受領 =====
         } 
        if (no=="6") {
            //          ===== 原HTMLデータ保存 =====
         } 
        if (no=="8") {
            if (myForm.hin.value=="") myForm.reset();
            else {
                HTreader.readAsText(HTfile);
            //          ===== HTML加工 =====
                setTimeout("document.getElementById('agent').value = 7;",5000);
            }
        }
}
let HTfile, HTreader;
window.addEventListener('load', () => {
  const f = document.getElementsByName('files')[0];
  f.addEventListener('change', evt => {
    let input = evt.target;
    if (input.files.length == 0) {
      console.log('No file selected');
      return;
    }
    const mode = myForm.mode.value;
    HTfile = input.files[0];
    HTreader = new FileReader();
    HTreader.onload = () => {
        console.log("変換処理に進みます: "+ HTfile.name);
        const newHtml = processHTML(HTreader.result, mode);
        // ダウンロードさせる、または別ウィンドウで開く
        const blob = new Blob([newHtml], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    };
  });
});
const savePage = (inout) => {
    const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = "https://mori1-hakua.tokyo/python/tmp/"+inout;
    a.download = inout ;
    a.click();
};
</script>
<h2>モザイク・アート作成エージェント</h2>

  出力HTMLファイル：ファイル名入力　<input type="text" name="hout" value=""/><br>
  <input type="hidden" name="hin" value="" />
  sel:<input type="text" name="sel" size=5 value="8" readonly />
  &nbsp;　　　プレビュー表示モード：&nbsp;<select id="mode" name="mode" value="2"/>
    <option value="2" selected>１．作成と戻し</option>

    <option value="0">３．戻し(含救済)</option>
    <option value="3">４．作成ｱﾆﾒｰｼｮﾝ</option>
</select></form></body>
